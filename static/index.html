<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --bg: #eaf0f3;
    --panel: #ffffff;
    --ink: #1b2a33;
    --muted: #61737d;
    --line: #d3dde3;
    --user: #1f5f7a;
    --user-ink: #ffffff;
    --bot: #f2f6f8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11191e;
      --panel: #19242b;
      --ink: #e6eef2;
      --muted: #8da0aa;
      --line: #2b3a43;
      --user: #3b8aa8;
      --user-ink: #08151b;
      --bot: #213039;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 "Segoe UI", system-ui, "Noto Sans Sinhala", sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 14px;
  }
  header button:hover { color: var(--ink); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { align-self: center; background: none; color: #c0392b; font-size: 14px; }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  form {
    display: flex;
    gap: 10px;
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    resize: none;
    max-height: 140px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font: inherit;
    background: var(--panel);
    color: var(--ink);
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--user); outline-offset: 2px; }
  #send {
    border: none; border-radius: 12px; padding: 0 20px;
    background: var(--user); color: var(--user-ink);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .dots span { animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Chat</h1>
    <button id="clear" type="button">New chat</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message" aria-label="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let history = [];

  function showEmpty() {
    log.innerHTML = '<div class="empty">Ask me anything to get started.</div>';
  }

  function add(role, text) {
    const empty = log.querySelector(".empty");
    if (empty) empty.remove();
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function submit() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    add("user", text);
    history.push({ role: "user", content: text });

    send.disabled = true;
    const pending = add("bot", "");
    pending.innerHTML = '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      pending.remove();
      if (!res.ok) {
        add("error", data.error || "Something went wrong.");
        history.pop(); // let the user retry
      } else {
        add("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (e) {
      pending.remove();
      add("error", "Can't reach the server. Is app.py running?");
      history.pop();
    }
    send.disabled = false;
    input.focus();
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
  document.getElementById("clear").addEventListener("click", () => { history = []; showEmpty(); });

  fetch("/api/config").then(r => r.json()).then(c => {
    document.getElementById("title").textContent = c.name;
    document.title = c.name;
  }).catch(() => {});

  showEmpty();
</script>
</body>
</html>
